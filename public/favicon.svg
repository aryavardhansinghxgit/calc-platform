<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nav-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle matching Navbar Theme -->
  <rect width="512" height="512" rx="116" fill="url(#nav-blue)"/>
  
  <!-- Subtle Highlight Border -->
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#60A5FA" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Calculator Icon Body Group -->
  <g filter="url(#shadow)">
    <!-- Main Calculator Shell -->
    <rect x="106" y="76" width="300" height="360" rx="52" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="32" stroke-linejoin="round"/>
    
    <!-- LCD Display Screen -->
    <rect x="156" y="126" width="200" height="60" rx="16" fill="url(#screen-glow)"/>
    <!-- LCD Digits / Bar Indicator -->
    <rect x="276" y="146" width="60" height="20" rx="6" fill="#1E40AF"/>
    
    <!-- Keypad Grid (Buttons & Functions) -->
    <!-- Row 1 -->
    <circle cx="178" cy="242" r="20" fill="#FFFFFF"/>
    <circle cx="256" cy="242" r="20" fill="#FFFFFF"/>
    <circle cx="334" cy="242" r="20" fill="#93C5FD"/>

    <!-- Row 2 -->
    <circle cx="178" cy="316" r="20" fill="#FFFFFF"/>
    <circle cx="256" cy="316" r="20" fill="#FFFFFF"/>
    <rect x="314" y="296" width="40" height="88" rx="20" fill="#60A5FA"/>

    <!-- Row 3 -->
    <circle cx="178" cy="384" r="20" fill="#FFFFFF"/>
    <circle cx="256" cy="384" r="20" fill="#FFFFFF"/>
  </g>
</svg>
